version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # Pin actions to commit SHAs (with version comment) for supply-chain safety.
    # Dependabot preserves the existing SHA-pinning style and bumps both the SHA
    # and the trailing version comment together.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
